<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f241d" />
    <!-- Google Search Console (svojstvo https://hunar.ba/); ne brisati, potvrda se provjerava i kasnije -->
    <meta name="google-site-verification" content="j13Xtfioow-YJ3zkW-0ezNsJ-7lQIhAnf1aKQqVCkAw" />
    <script>
      // Pokreti (priča na početnoj i animacije ostalih stranica) samo uz JavaScript i bez "smanji pokrete".
      // Ako se pokretač ne javi za 6 s, stranica se vraća u običan izgled.
      (function () {
        var h = document.documentElement
        h.classList.add('js')
        if (window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          h.classList.add('pokret')
          setTimeout(function () {
            // Početnu potvrđuje njen pokretač (kz), ostale stranice sistem pokreta (pokreti).
            var prica = document.querySelector('.kz-prica')
            if (prica ? !h.dataset.kz : !h.dataset.pokreti) h.classList.remove('pokret')
          }, 6000)
        }
      })()
    </script>

    <!-- favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- title / description / Open Graph are managed per page via <Seo> (react-helmet-async) -->
  </head>
  <body>
    <!-- Static form so Netlify Forms detects "kontakt" at build time (SPA submits to it) -->
    <form name="kontakt" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="ime" />
      <input type="text" name="firma" />
      <input type="text" name="kontakt" />
      <input type="text" name="treba" />
      <textarea name="poruka"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
