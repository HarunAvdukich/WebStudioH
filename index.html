<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta property="og:locale" content="bs_BA" />

    <!-- favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- title / description / Open Graph are managed per page via <Seo> (react-helmet-async) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Privacy-friendly analytics (no cookies). Requires a Plausible account for webstudioh.ba. -->
    <script
      defer
      data-domain="webstudioh.ba"
      src="https://plausible.io/js/script.js"
    ></script>
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Static form so Netlify Forms detects "kontakt" at build time (SPA submits to it) -->
    <form name="kontakt" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
