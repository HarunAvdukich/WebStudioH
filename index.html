<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0B0D" />
    <script>
      // Živa priča na početnoj samo uz JavaScript i bez "smanji pokrete".
      // Ako se pokretač ne javi za 6 s, stranica se vraća u običan izgled.
      (function () {
        var h = document.documentElement
        h.classList.add('js')
        if (window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          h.classList.add('pokret')
          setTimeout(function () {
            if (!h.dataset.kz && document.querySelector('.kz-prica')) h.classList.remove('pokret')
          }, 6000)
        }
      })()
    </script>

    <!-- favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- title / description / Open Graph are managed per page via <Seo> (react-helmet-async) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- slova starih stranica; ne blokiraju prvo iscrtavanje (početna koristi Urbanist) -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Static form so Netlify Forms detects "kontakt" at build time (SPA submits to it) -->
    <form name="kontakt" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
