[build]
  command = "npm run build"
  publish = "dist"

# Long-cache hashed assets (safe: filenames change on content change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stara Netlify adresa vodi na hunar.ba, da Google ne vidi dva ista sajta.
# Pregledi (deploy-preview-N--webstudioh.netlify.app) su drugi host i ostaju.
[[redirects]]
  from = "https://webstudioh.netlify.app/*"
  to = "https://hunar.ba/:splat"
  status = 301
  force = true

# Nema SPA preusmjerenja: sve stranice su unaprijed izgrađene, a adresa koja ne
# postoji dobije dist/404.html sa statusom 404 (ranije je vraćala početnu sa 200).

# Demo zakazivanja je prije bio na /demo-berbernica; stari linkovi iz poruka vode na novi (upit ostaje).
[[redirects]]
  from = "/demo-berbernica"
  to = "/demo-termini"
  status = 301
