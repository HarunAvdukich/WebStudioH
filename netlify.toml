[build]
  command = "npm run build"
  publish = "dist"

# Long-cache hashed assets (safe: filenames change on content change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for any path without a prerendered file (client renders it)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
