<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8" />
  <!-- Šablon za OG slike 1200x630. Tekst ide kroz ?eyebrow=...&title=..., snima se gstack browseom. -->
  <!-- Izgled "Kroz znak": Urbanist iz projekta, tamnozelena pozadina sa smaragdnim sjajem. -->
  <style>
    @font-face { font-family: 'Urbanist Variable'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/urbanist/files/urbanist-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Urbanist Variable'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/urbanist/files/urbanist-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    html, body { margin: 0; background: #0f241d; }
    #og {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: radial-gradient(700px 520px at 78% 0%, rgba(14, 138, 100, 0.42), transparent 70%), #0f241d;
      color: #f4f4f2; font-family: 'Urbanist Variable', sans-serif; -webkit-font-smoothing: antialiased;
    }
    #logo { position: absolute; left: 76px; top: 66px; height: 52px; }
    #eyebrow {
      position: absolute; left: 76px; top: 340px; font-weight: 700; font-size: 22px;
      letter-spacing: 0.2em; text-transform: uppercase; color: #19b07e;
    }
    #title {
      position: absolute; left: 76px; right: 110px; top: 378px; margin: 0;
      font-weight: 700; font-size: 66px; line-height: 1.04; letter-spacing: -0.035em;
    }
    #domain { position: absolute; left: 76px; bottom: 56px; font-size: 24px; font-weight: 600; color: #a9bdb4; }
  </style>
</head>
<body>
  <div id="og">
    <img id="logo" src="../../public/hunar-logo-svijetli.svg" alt="" />
    <div id="eyebrow"></div>
    <h1 id="title"></h1>
    <div id="domain">hunar.ba</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search)
    document.getElementById('eyebrow').textContent = q.get('eyebrow') || ''
    document.getElementById('title').textContent = q.get('title') || ''
  </script>
</body>
</html>
