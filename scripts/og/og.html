<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8" />
  <!-- Šablon za OG slike 1200x630 u svijetu etiketa. ?eyebrow=...&title=...[&proof=mrt] ; snima se gstack browseom. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Red+Hat+Mono:wght@600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; }
    #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #ffd400; color: #111; font-family: Archivo, sans-serif; }
    .rail { position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #b9bfc6; border-bottom: 3px solid #6f767e; }
    .brand { position: absolute; left: 72px; top: 64px; display: flex; font-stretch: 72%; font-weight: 900; font-size: 40px; line-height: 1; text-transform: uppercase; }
    .brand span:first-child { background: #111; color: #fff; padding: 10px 12px 8px 14px; }
    .brand span:last-child { background: #e30613; color: #fff; padding: 10px 13px 8px; }
    #title { position: absolute; left: 72px; right: 72px; top: 170px; margin: 0; font-stretch: 66%; font-weight: 900; font-size: 104px; line-height: 0.92; letter-spacing: -0.005em; }
    .with-proof #title { right: 560px; font-size: 92px; }
    .tag { position: absolute; left: 72px; bottom: 64px; background: #fff; border: 2px solid #111; padding: 12px 18px 10px; font-family: 'Red Hat Mono', monospace; font-weight: 600; font-size: 24px; letter-spacing: 0.04em; text-transform: uppercase; }
    .domain { position: absolute; right: 72px; bottom: 72px; font-family: 'Red Hat Mono', monospace; font-weight: 600; font-size: 26px; }
    .with-proof .domain { display: none; }
    #proof { display: none; position: absolute; right: 64px; top: 44px; width: 440px; background: #fff; border: 2px solid #111; }
    .with-proof #proof { display: block; }
    #proof::before { content: ''; position: absolute; top: -30px; left: 50%; width: 60px; height: 28px; margin-left: -30px; background: #b9bfc6; border: 3px solid #6f767e; border-top: 0; }
    .p-head { display: flex; justify-content: space-between; background: #111; color: #fff; padding: 10px 14px; font-family: 'Red Hat Mono', monospace; font-weight: 600; font-size: 17px; text-transform: uppercase; }
    .p-head b { font-family: Archivo, sans-serif; font-stretch: 80%; font-weight: 800; font-size: 22px; text-transform: none; }
    .p-shot { display: block; width: 100%; height: 200px; object-fit: cover; object-position: top; border-bottom: 2px solid #111; }
    .p-rows { padding: 6px 14px 12px; }
    .p-row { display: flex; justify-content: space-between; padding: 9px 0 8px; border-bottom: 2px solid #111; font-size: 21px; font-weight: 600; }
    .p-row b { font-family: 'Red Hat Mono', monospace; font-size: 22px; }
  </style>
</head>
<body>
  <div id="og">
    <div class="rail"></div>
    <div class="brand"><span>WebStudio</span><span>H</span></div>
    <h1 id="title"></h1>
    <div class="tag" id="eyebrow"></div>
    <div class="domain">webstudioh.ba</div>
    <div id="proof">
      <div class="p-head"><b>mrt.ba</b><span>Šifra MRT-01</span></div>
      <img class="p-shot" src="../../public/project-mrt.webp" alt="" />
      <div class="p-rows">
        <div class="p-row"><span>Artikala</span><b>7.400+</b></div>
        <div class="p-row"><span>OLX oglasa</span><b>4.300+</b></div>
        <div class="p-row"><span>Odziv servera</span><b>52 ms</b></div>
      </div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search)
    document.getElementById('eyebrow').textContent = q.get('eyebrow') || ''
    document.getElementById('title').textContent = q.get('title') || ''
    if (q.get('proof') === 'mrt') document.getElementById('og').classList.add('with-proof')
  </script>
</body>
</html>
