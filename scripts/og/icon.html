<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8" />
  <!-- Ikona sajta: crvena naljepnica sa slovom H iz logotipa. ?pad=0..0.3 daje sigurnu zonu za maskable. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; }
    #icon { width: 512px; height: 512px; display: grid; place-items: center; background: #e30613; }
    #icon span { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 900; color: #fff; line-height: 1; }
  </style>
</head>
<body>
  <div id="icon"><span id="h">H</span></div>
  <script>
    const pad = Number(new URLSearchParams(location.search).get('pad') || 0)
    document.getElementById('h').style.fontSize = Math.round(430 * (1 - pad * 2)) + 'px'
  </script>
</body>
</html>
